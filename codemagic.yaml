
workflows:
  boogle-home-ios:
    name: Boogle Home iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.boogleHome

    integrations:
      app_store_connect: BoogleHomeKey

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Configure iOS code signing
        script: xcode-project use-profiles

      - name: Build Boogle Home IPA
        script: flutter build ipa --release --build-name=1.0.0 --build-number=$PROJECT_BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
